name: CI

# Build, test, prove, and document the json crate on every push to master and
# every PR. Doc-only changes are skipped.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Cancel an in-flight run when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No toolchain: the gate is grep over `git ls-files`, so it runs on a bare
  # checkout in seconds. Making it the root of the job graph (so it fails before
  # anything compiles) is deliberately left to the CI-DAG change.
  trust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails if json/src holds a suppression, SPARK_Mode => Off, pragma Assume,
      # GNATprove justification, foreign import or native source that
      # scripts/trust-surface.txt does not name and justify -- and equally if the
      # manifest names one the tree no longer has.
      - name: Check trust surface
        run: make trust-check

  # API documentation + the doc gate (issue #7). Deliberately a SIBLING of
  # build-test-prove with no `needs:` edge: imposing the job graph (docs ahead of
  # build and proof, so an undocumented entity is answered before the runner
  # spends a build on it) is issue #9's job, and putting the edge here would
  # collide with it. Until then the two run concurrently, which costs nothing and
  # gives both signals in the same run.
  #
  # Note the `paths-ignore: '**.md'` above: a README-only change does not start
  # this workflow, yet README.md IS a source of the readme_example root (the
  # snippet is extracted and gated like any other unit). So a README edit can
  # break `make docs-check` without CI saying so until the next code push. Issue
  # #9 revisits paths-ignore.
  docs:
    name: GNATdoc (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pins as the job below: alr 2.x for `alr install`, and gnat_native
      # 16.x so the sources gnatdoc parses are the ones the compiler accepts.
      - name: Install Alire
        uses: alire-project/setup-alire@v6.0.0
        with:
          version: 2.1.1
          toolchain: gnat_native=16.1.0 gprbuild

      # gnatdoc is a tool, not something json links against, so it is not a crate
      # dependency — the same reasoning that keeps gnatprove out of alire.toml.
      # Adding it there would make every job and every fresh local checkout fetch
      # a binary crate it never uses, because alr materializes the whole
      # dependency solution before building. Pinned to an exact version for the
      # same reason the prover is: the set of warnings IS the gate, so a silent
      # bump must not be able to change what CI accepts.
      #
      # 26.0.0 is the generation that pairs with FSF gnat_native 16.1.0. The
      # gnatdoc *source* crate does not build against it (libadalang/libgpr2/vss
      # skew) — the binary crate is what makes `make docs` possible under the 16
      # toolchain at all.
      - name: Install GNATdoc
        run: |
          alr -n install gnatdoc_bin=26.0.0
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      # THE gate. scripts/check-docs.sh drives all four project roots and exits
      # non-zero on any undocumented entity in our own sources; the inventory
      # lands in the job summary, so a failure is readable without opening the
      # log. Its prerequisite (make docs-deps) only generates the Alire config
      # projects and extracts the README example — nothing is compiled or
      # linked, so this job needs no built library and no prover.
      - name: Check documentation
        run: make docs-check

      # `always()`: the step above fails the job, and the HTML is generated
      # before the gate reads the report — it is most worth looking at exactly
      # when the gate has just rejected something.
      - name: Upload API docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api

  build-test-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-alire installs alr plus the requested GNAT + gprbuild toolchain.
      # Pin Alire 2.x: the older setup-alire@v2 default (alr 1.2.2) predates the
      # `alr install` command and only resolves a 13.x toolchain from its index.
      # Pin gnat_native to the 16 series so the compiler matches GNATprove 16.
      - name: Install Alire
        uses: alire-project/setup-alire@v6.0.0
        with:
          version: 2.1.1
          toolchain: gnat_native=16.1.0 gprbuild

      # GNATprove is a standalone tool (not part of the toolchain and not a
      # solution dependency). Install 16.x into ~/.alire and put it on PATH so
      # `alr exec -- gnatprove` finds it.
      - name: Install GNATprove
        run: |
          alr -n install gnatprove^16
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Build
        run: make build

      # Compile the Ada example from the README against the library so the
      # documented snippet can't rot out of sync with the API.
      - name: Check README example
        run: make check-readme

      - name: Test
        run: make tests

      # Prove to Silver and gate on the expected-failure baseline: fails on any
      # unproved check outside scripts/proof-xfail.txt (empty — json proves fully).
      #
      # Local dev proves at the default --level=2 (see the Makefile). Here we add
      # --timeout=10 via GNATPROVE_EXTRA: --level timeouts are wall-clock rather
      # than step-bounded, so a couple of sticky floating-point checks in
      # Scan_Number that discharge on a fast dev machine can time out on the
      # slower GitHub runner. The extra wall-clock removes that flakiness without
      # weakening the proof level.
      - name: Prove
        env:
          GNATPROVE_EXTRA: --timeout=10
        run: make prove-check
