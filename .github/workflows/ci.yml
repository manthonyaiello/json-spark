name: CI

# Build, test, prove, and document the json crate on every push to master and
# every PR. The four signals form a graph, cheapest gate first:
#
#     trust --> docs --> build-test
#                    --> prove
#
# `trust` needs no toolchain at all — grep over `git ls-files` — so it is the
# cheapest signal by an order of magnitude and reports in seconds. A PR that
# widens what the proof does not cover is answered before a runner spends a build
# on it.
#
# `docs` is the second gate. Be honest about what the edge buys: the docs job has
# to provision and parse the sources either way, so what gating actually saves is
# the test run and the prover — worth it, because an undocumented entity means
# the tree is not worth spending the prover on.
#
# `build-test` and `prove` are siblings with NO edge between them, deliberately:
# proof needs the sources to compile, which it arranges for itself, not the tests
# to pass. When something is broken we want both signals in the same run instead
# of one hiding the other. That argument does not extend to `docs`, which is why
# `docs` is a gate and this is not.
#
# Every push and every PR gets a run: there is no `paths-ignore`. README.md is a
# source of this project — the readme_example root compiles a snippet extracted
# from it, and both `make check-readme` and `make docs-check` gate on it — and
# scripts/trust-surface.txt is itself gated content, so a "doc-only" change can
# break a gate. Running always also removes the cancel hazard at its root:
# cancel-in-progress can then only cancel a genuinely superseded run on the same
# ref, never leave a commit that nothing ever gated. The cost is absorbed by the
# two gates that need no toolchain.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Every job only reads the repo: there is no cache to restore,
# save or purge here, so nothing needs `actions: write` — and granting it would
# both over-grant and fail fork PRs outright, whose token cannot be elevated.
permissions:
  contents: read

jobs:
  # The trust-surface gate: every site a proof of this tree does not cover must
  # be listed, with a justification, in scripts/trust-surface.txt. Checkout and
  # grep — no Alire, no compile — so it is the root of the graph.
  trust:
    name: Trust surface (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fails if json/src holds a suppression, SPARK_Mode => Off, pragma Assume,
      # GNATprove justification, foreign import or native source that
      # scripts/trust-surface.txt does not name and justify -- and equally if the
      # manifest names one the tree no longer has.
      - name: Check trust surface
        run: make trust-check

  # API documentation + the doc gate. `build-test` and `prove` both wait on it;
  # see the graph in the header comment for what that edge saves.
  docs:
    name: GNATdoc (gate)
    needs: trust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire toolchain
        uses: ./.github/actions/setup-alire
        with:
          gnatdoc: 'true'

      # THE gate, in two halves. scripts/check-docs.sh drives all four project
      # roots and exits non-zero on any undocumented entity in our own sources;
      # then scripts/check-doc-placement.sh exits non-zero on any doc block
      # attributed to the wrong declaration, which the gnatdoc run cannot see
      # (--warnings is per entity, not per declaration). Both inventories land in
      # the job summary, so a failure is readable without opening the log.
      #
      # Its prerequisite (make docs-deps) only generates the Alire config
      # projects and extracts the README example — nothing is compiled or
      # linked, so this job needs no built library and no prover.
      - name: Check documentation
        run: make docs-check

      # `always()`: the step above fails the job, and the HTML is generated
      # before the gate reads the report — it is most worth looking at exactly
      # when the gate has just rejected something.
      - name: Upload API docs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/api

  build-test:
    name: Build + test
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire toolchain
        uses: ./.github/actions/setup-alire

      - name: Build
        run: make build

      # Compile the Ada example from the README against the library so the
      # documented snippet can't rot out of sync with the API.
      #
      # This step MUST stay ahead of `make tests`: tests rebuild the library
      # with ADAFLAGS="--coverage -gnata", readme_example links without
      # --coverage, and the resulting link fails on undefined ___gcov_* symbols.
      - name: Check README example
        run: make check-readme

      - name: Test
        run: make tests

  # A sibling of build-test with no `needs:` edge, so the two run concurrently:
  # proof depends on compilation, which it arranges for itself via prove-deps,
  # not on a passing test run. Behind the same `docs` gate.
  prove:
    name: Prove (SPARK Silver)
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire toolchain
        uses: ./.github/actions/setup-alire
        with:
          gnatprove: 'true'

      # Prove to Silver and gate on the expected-failure baseline: fails on any
      # unproved check outside scripts/proof-xfail.txt (empty — json proves
      # fully).
      #
      # Local dev proves at the default --level=2 (see the Makefile). Here we add
      # --timeout=10 via GNATPROVE_EXTRA: --level timeouts are wall-clock rather
      # than step-bounded, so a couple of sticky floating-point checks in
      # Scan_Number that discharge on a fast dev machine can time out on the
      # slower GitHub runner. The extra wall-clock removes that flakiness without
      # weakening the proof level.
      - name: Prove
        env:
          GNATPROVE_EXTRA: --timeout=10
        run: make prove-check
